dependencies:
  m5stack/m5unified: "=0.2.25"
  m5stack/m5gfx: "=0.2.32"
  # Capa de API Wi-Fi para chips anfitriones sin radio propia.
  espressif/esp_wifi_remote: "=0.5.1"
  # El ESP32-P4 no tiene radio. Esta version coincide con la generacion 1.4.x
  # del firmware SDIO que M5Stack instala de fabrica en el ESP32-C6 del Tab5.
  espressif/esp_hosted: "=1.4.1"
  # Descubrimiento automático del MacBook que anuncia whisper-server.
  espressif/mdns: "=1.13.1"
  # Monitor USB: retain IDF 5.4.2 and its built-in USB Host library.
  espressif/usb_host_uvc: "=2.6.0"
