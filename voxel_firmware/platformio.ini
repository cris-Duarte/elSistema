[platformio]
default_envs = tab5

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
board = esp32-p4-evboard
framework = arduino
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 1500000
build_type = release
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32
extra_scripts = post:tools/pio_m5gfx.py

[env:tab5_diagnostic]
extends = env:tab5
build_flags = ${env:tab5.build_flags} -DVOXEL_DIAGNOSTIC=1

[env:tab5_quality]
extends = env:tab5
build_flags = ${env:tab5.build_flags} -DVOXEL_WIDTH=256 -DVOXEL_HEIGHT=144

[env:tab5_benchmark]
extends = env:tab5
build_flags = ${env:tab5.build_flags} -DVOXEL_BENCHMARK=1
